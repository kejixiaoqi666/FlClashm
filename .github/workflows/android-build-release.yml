name: android-build-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: false

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.13004108"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Get Flutter dependencies
        run: |
          flutter --version
          rm -rf ~/.pub-cache/git/yaml_writer-* ~/.pub-cache/git/cache/yaml_writer-* || true
          flutter pub get

      - name: Build Android
        run: |
          dart setup.dart android

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 77net-android
          path: ./dist
          overwrite: true

      - name: Generate sha256
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ./dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
